<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%" fill="none">
  <defs>
    <!-- Sombra projetada da unidade -->
    <filter id="unitShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Brilho neon para o LED e setas de direção -->
    <filter id="ledGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Desfoque suave para a cortina de ar frio -->
    <filter id="airMistBlur" x="-20%" y="-10%" width="140%" height="130%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <!-- Gradiente do painel frontal principal -->
    <linearGradient id="frontFaceGrad" x1="80" y1="45" x2="90" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="68%" stop-color="#F6F7F9" />
      <stop offset="100%" stop-color="#E2E5EA" />
    </linearGradient>

    <!-- Gradiente da face superior -->
    <linearGradient id="topFaceGrad" x1="85" y1="42" x2="325" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDEFF2" />
    </linearGradient>

    <!-- Gradiente da lateral direita (efeito 3D) -->
    <linearGradient id="rightSideGrad" x1="312" y1="56" x2="332" y2="138" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CFD4DC" />
      <stop offset="50%" stop-color="#B8BFC9" />
      <stop offset="100%" stop-color="#9BA3B0" />
    </linearGradient>

    <!-- Gradiente da base inferior -->
    <linearGradient id="bottomLipGrad" x1="82" y1="110" x2="320" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D5DAE2" />
      <stop offset="100%" stop-color="#B0B7C3" />
    </linearGradient>

    <!-- Gradiente do interior da saída de ar (aberta) -->
    <linearGradient id="ventDarkGrad" x1="86" y1="108" x2="306" y2="134" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E242D" />
      <stop offset="100%" stop-color="#12161C" />
    </linearGradient>

    <!-- Gradiente da névoa/cortina de vento principal -->
    <linearGradient id="windCurtainGrad" x1="195" y1="115" x2="165" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DCEFFF" stop-opacity="0.38" />
      <stop offset="35%" stop-color="#B8E2FF" stop-opacity="0.22" />
      <stop offset="75%" stop-color="#88CCFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#88CCFF" stop-opacity="0" />
    </linearGradient>

    <!-- Gradiente das linhas de fluxo de vento -->
    <linearGradient id="windLineGrad" x1="190" y1="116" x2="155" y2="242" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="18%" stop-color="#E5F4FF" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#AEE0FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#88CCFF" stop-opacity="0" />
    </linearGradient>

    <!-- Gradiente para as setas principais de direção do vento -->
    <linearGradient id="directionArrowGrad" x1="185" y1="120" x2="145" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#7DD3FC" stop-opacity="0.95" />
      <stop offset="85%" stop-color="#E0F7FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>

    <style>
      .wind-stream {
        stroke-dasharray: 95 25;
        animation: airFlow 2.6s linear infinite;
      }
      .direction-pulse {
        animation: arrowPulse 2.2s ease-in-out infinite;
      }
      .direction-pulse-delay-1 {
        animation: arrowPulse 2.2s ease-in-out 0.35s infinite;
      }
      .direction-pulse-delay-2 {
        animation: arrowPulse 2.2s ease-in-out 0.7s infinite;
      }
      .swing-arc {
        animation: swingGlow 2.8s ease-in-out infinite;
      }
      @keyframes airFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes arrowPulse {
        0%, 100% { opacity: 0.65; transform: translate(0, 0); }
        50% { opacity: 1; transform: translate(-2px, 3px); }
      }
      @keyframes swingGlow {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- CAMADA DE VENTO DE FUNDO -->
  <g id="airflow-effect">
    <!-- Cortina de ar difusa -->
    <path d="M 90 115 L 302 134 C 296 175 278 212 246 250 L 42 225 C 68 188 84 152 90 115 Z" fill="url(#windCurtainGrad)" filter="url(#airMistBlur)" />

    <!-- Linhas sutis de fluxo de ar -->
    <g stroke="url(#windLineGrad)" stroke-linecap="round" fill="none">
      <path class="wind-stream" stroke-width="1.3" d="M 98 116 C 94 148 78 182 50 218" />
      <path class="wind-stream" stroke-width="1.3" d="M 130 119 C 126 151 110 187 83 224" />
      <path class="wind-stream" stroke-width="1.3" d="M 162 122 C 158 155 142 191 117 230" />
      <path class="wind-stream" stroke-width="1.3" d="M 195 125 C 191 158 176 196 152 235" />
      <path class="wind-stream" stroke-width="1.3" d="M 228 128 C 224 162 209 200 187 241" />
      <path class="wind-stream" stroke-width="1.3" d="M 261 131 C 257 165 243 205 222 246" />
      <path class="wind-stream" stroke-width="1.3" d="M 292 134 C 288 168 274 209 255 251" />
    </g>
  </g>

  <!-- INDICADORES DE DIREÇÃO DO VENTO (Setas Aerodinâmicas + Ângulo de Swing) -->
  <g id="wind-direction-indicators">
    <!-- 4 Setas curvas principais mostrando a trajetória/direção do vento -->
    <!-- Seta 1 (Esquerda) -->
    <g class="direction-pulse" filter="url(#ledGlow)">
      <path d="M 114 122 C 110 152 96 182 72 212" stroke="url(#directionArrowGrad)" stroke-width="2.6" stroke-linecap="round" />
      <path d="M 69 202 L 71 214 L 82 210" stroke="#E0F7FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Seta 2 (Centro-Esquerda) -->
    <g class="direction-pulse-delay-1" filter="url(#ledGlow)">
      <path d="M 164 126 C 160 156 146 188 122 219" stroke="url(#directionArrowGrad)" stroke-width="2.6" stroke-linecap="round" />
      <path d="M 119 209 L 121 221 L 132 217" stroke="#E0F7FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Seta 3 (Centro-Direita) -->
    <g class="direction-pulse-delay-2" filter="url(#ledGlow)">
      <path d="M 214 131 C 210 161 196 193 172 225" stroke="url(#directionArrowGrad)" stroke-width="2.6" stroke-linecap="round" />
      <path d="M 169 215 L 171 227 L 182 223" stroke="#E0F7FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Seta 4 (Direita) -->
    <g class="direction-pulse" filter="url(#ledGlow)">
      <path d="M 264 135 C 260 165 246 198 222 231" stroke="url(#directionArrowGrad)" stroke-width="2.6" stroke-linecap="round" />
      <path d="M 219 221 L 221 233 L 232 229" stroke="#E0F7FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Indicador Lateral de Ângulo Vertical (Swing / Direção da Aleta) -->
    <g id="swing-angle-indicator" class="swing-arc">
      <!-- Linhas pontilhadas de níveis de direção vertical -->
      <line x1="305" y1="135" x2="342" y2="142" stroke="#7DD3FC" stroke-width="1.3" stroke-dasharray="3 3" opacity="0.65" />
      <line x1="305" y1="135" x2="338" y2="160" stroke="#38BDF8" stroke-width="1.6" stroke-dasharray="3 3" opacity="0.9" />
      <line x1="305" y1="135" x2="325" y2="176" stroke="#7DD3FC" stroke-width="1.3" stroke-dasharray="3 3" opacity="0.65" />

      <!-- Arco bidirecional de oscilação (Swing Vertical) -->
      <path d="M 346 138 A 46 46 0 0 1 326 182" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" filter="url(#ledGlow)" />
      <!-- Pontas da seta do arco de Swing -->
      <path d="M 341 142 L 346 137 L 350 143" stroke="#E0F7FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 324 176 L 325 183 L 332 180" stroke="#E0F7FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Ponto de pivô da aleta -->
      <circle cx="305" cy="135" r="3" fill="#38BDF8" filter="url(#ledGlow)" />
      <circle cx="305" cy="135" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Arco de distribuição horizontal na base do fluxo -->
    <g opacity="0.85">
      <path d="M 60 226 Q 145 252 242 244" stroke="#7DD3FC" stroke-width="1.6" stroke-dasharray="5 5" stroke-linecap="round" />
      <path d="M 66 222 L 58 225 L 63 231" stroke="#7DD3FC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 237 240 L 244 244 L 238 249" stroke="#7DD3FC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Grupo principal do Ar-Condicionado (Ligado) -->
  <g id="ac-unit-on" filter="url(#unitShadow)">
    <!-- Base / Chassi traseiro inferior -->
    <path d="M 84 106 L 312 126 L 326 117 L 326 130 C 326 135 320 139 312 140 L 92 120 C 86 119 82 115 82 110 Z" fill="url(#bottomLipGrad)" />

    <!-- Lateral Direita 3D -->
    <path d="M 310 60 L 325 54 C 329 53 332 56 332 61 L 332 116 C 332 122 328 128 322 132 L 310 138 Z" fill="url(#rightSideGrad)" />

    <!-- Topo 3D -->
    <path d="M 84 44 C 88 41 94 40 100 41 L 322 53 C 326 53 328 55 325 57 L 310 62 L 80 48 Z" fill="url(#topFaceGrad)" />

    <!-- Abertura da saída de ar inferior (aberta) -->
    <path d="M 86 106 L 306 125 L 304 135 L 88 116 Z" fill="url(#ventDarkGrad)" />

    <!-- Brilho azulado dentro da saída de ar -->
    <path d="M 88 109 L 304 128 L 303 134 L 88 115 Z" fill="#38BDF8" opacity="0.22" />

    <!-- Aletas verticais internas orientadas na direção do fluxo -->
    <g stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round" opacity="0.85">
      <line x1="96" y1="108" x2="93" y2="116" />
      <line x1="106" y1="109" x2="103" y2="117" />
      <line x1="116" y1="110" x2="113" y2="118" />
      <line x1="126" y1="111" x2="123" y2="119" />
      <line x1="136" y1="111.8" x2="133" y2="119.8" />
      <line x1="146" y1="112.7" x2="143" y2="120.7" />
      <line x1="156" y1="113.5" x2="153" y2="121.5" />
      <line x1="166" y1="114.4" x2="163" y2="122.4" />
      <line x1="176" y1="115.2" x2="173" y2="123.2" />
      <line x1="186" y1="116.1" x2="183" y2="124.1" />
      <line x1="196" y1="117" x2="193" y2="125" />
      <line x1="206" y1="117.8" x2="203" y2="125.8" />
      <line x1="216" y1="118.7" x2="213" y2="126.7" />
      <line x1="226" y1="119.5" x2="223" y2="127.5" />
      <line x1="236" y1="120.4" x2="233" y2="128.4" />
      <line x1="246" y1="121.2" x2="243" y2="129.2" />
      <line x1="256" y1="122.1" x2="253" y2="130.1" />
      <line x1="266" y1="123" x2="263" y2="131" />
      <line x1="276" y1="123.8" x2="273" y2="131.8" />
      <line x1="286" y1="124.7" x2="283" y2="132.7" />
      <line x1="296" y1="125.5" x2="293" y2="133.5" />
    </g>

    <!-- Defletor / Pá aberta destacada com borda iluminada -->
    <path d="M 85 114 L 305 133 L 301 139 L 82 119 Z" fill="#F1F5F9" stroke="#38BDF8" stroke-width="0.9" />

    <!-- Painel Frontal Principal Curvo -->
    <path d="M 84 44 C 80 45 78 49 78 55 L 78 100 C 78 104 81 107 86 108 L 306 127 C 310 127 313 124 313 119 L 313 65 C 313 60 310 57 305 57 L 84 44 Z" fill="url(#frontFaceGrad)" />

    <!-- Linha de divisão sutil no painel frontal -->
    <path d="M 80 101 L 311 120" stroke="#D0D5DD" stroke-width="1" opacity="0.8" />

    <!-- Brilho na borda superior frontal -->
    <path d="M 83 45.5 L 307 58.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.95" />

    <!-- MOSTRADOR DE TEMPERATURA + ÍCONE DE DIREÇÃO EM LED -->
    <g id="led-panel-on" transform="translate(232, 75) skewY(4.8)">
      <!-- Fundo escuro translúcido do visor ampliado -->
      <rect x="0" y="0" width="64" height="24" rx="5" fill="#131922" opacity="0.9" stroke="#D8DEE8" stroke-width="0.8" />
      <rect x="2" y="2" width="60" height="20" rx="4" fill="#0EA5E9" opacity="0.14" />

      <!-- Temperatura em LED -->
      <text id="led-temperature" x="21" y="16.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" fill="#E0F7FF" text-anchor="middle" letter-spacing="0.3" filter="url(#ledGlow)">21°C</text>

      <!-- Divisória interna do visor -->
      <line x1="41" y1="5" x2="41" y2="19" stroke="#38BDF8" stroke-width="0.7" opacity="0.35" />

      <!-- Mini ícone LED de direção da aleta/vento no visor -->
      <path d="M 46 8 L 56 8 M 48 11 L 54 17 M 50 17 L 54 17 L 54 13" stroke="#7DD3FC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#ledGlow)" />
      <path d="M 46 16 A 7 7 0 0 0 53 18" stroke="#38BDF8" stroke-width="1.1" stroke-linecap="round" />
    </g>
  </g>
</svg>
